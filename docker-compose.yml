version: "3.8"

services:
  agent:
    build: ./agent-demo-agent
    ports:
      - "8001:8001"
    volumes:
      - ./agent-demo-agent/data:/app/data
      - ./agent-demo-agent/knowledge:/app/knowledge
    env_file:
      - ./agent-demo-agent/.env
    restart: unless-stopped

  server:
    build: ./agent-demo-server
    ports:
      - "8000:8000"
    depends_on:
      - agent
    volumes:
      - ./agent-demo-server/data:/app/data
    env_file:
      - ./agent-demo-server/.env
    restart: unless-stopped

  web:
    build: ./agent-demo-web
    ports:
      - "3000:3000"
    depends_on:
      - server
    restart: unless-stopped
