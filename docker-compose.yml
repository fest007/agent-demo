version: "3.8"

services:
  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: agent-demo-server/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./agent-demo-server/data:/app/data
      - ./agent-demo-agent/data:/app/agent-demo-agent/data
      - ./agent-demo-agent/knowledge:/app/agent-demo-agent/knowledge
    env_file:
      - ./agent-demo-agent/.env
      - ./agent-demo-server/.env
    environment:
      VECTOR_STORE: ${VECTOR_STORE:-qdrant}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
    depends_on:
      - qdrant
    restart: unless-stopped

  web:
    build: ./agent-demo-web
    ports:
      - "3000:3000"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  qdrant_data:
