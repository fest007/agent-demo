[project]
name = "agent-demo-agent"
version = "0.3.2"
description = "智能 Agent 核心层 - 基于 LangGraph"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langchain-community>=0.3",
    "langchain-experimental>=0.3",
    "langchain-text-splitters>=0.3",
    "langchain-mcp-adapters>=0.0.1",
    "langmem>=0.0.1",
    "chromadb>=0.5",
    "qdrant-client>=1.12",
    "sentence-transformers>=3.0",
    "edge-tts>=6.1",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "duckduckgo-search>=6.0",
    "wikipedia>=1.4",
    "beautifulsoup4>=4.12",
    "numexpr>=2.10",
    "requests>=2.31",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
