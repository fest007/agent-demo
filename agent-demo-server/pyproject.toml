[project]
name = "agent-demo-server"
version = "0.3.1"
description = "智能 Agent 后端服务层 - FastAPI"
requires-python = ">=3.11"
dependencies = [
    "agent-demo-agent",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.0",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "sqladmin>=0.19",
]

[tool.uv.sources]
agent-demo-agent = { path = "../agent-demo-agent", editable = true }

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/server"]

[tool.ruff]
line-length = 100
target-version = "py311"
