name: Release

on:
  push:
    branches:
      - main
    paths:
      - "VERSION"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.2.0"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-latest
          - name: windows
            os: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 23
        uses: actions/setup-node@v4
        with:
          node-version: "23"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Rust
        run: rustup default stable

      - name: Enable pnpm
        run: corepack enable

      - name: Install frontend dependencies
        working-directory: agent-demo-web
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: agent-demo-web
        run: pnpm build

      - name: Install uv
        run: python -m pip install uv

      - name: Validate agent dependencies
        working-directory: agent-demo-agent
        run: uv sync --locked

      - name: Validate server dependencies
        working-directory: agent-demo-server
        run: uv sync --locked

      - name: Build Python sidecar
        run: node scripts/build-sidecar.mjs

      - name: Build desktop installer
        working-directory: agent-demo-web
        run: pnpm tauri build --bundles ${{ runner.os == 'Windows' && 'nsis' || 'dmg' }}

      - name: Collect macOS installer
        if: runner.os != 'Windows'
        shell: bash
        run: |
          VERSION="$(cat VERSION)"
          mkdir -p dist-release/installers
          DMG="$(find agent-demo-web/src-tauri/target/release/bundle/dmg -name '*.dmg' | head -1)"
          cp "$DMG" "dist-release/installers/agent-demo-${VERSION}-macos.dmg"

      - name: Collect Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content VERSION).Trim()
          New-Item -ItemType Directory -Force -Path dist-release/installers | Out-Null
          $exe = Get-ChildItem agent-demo-web/src-tauri/target/release/bundle/nsis -Filter *.exe | Select-Object -First 1
          Copy-Item $exe.FullName "dist-release/installers/agent-demo-$version-windows.exe" -Force

      - name: Prepare release bundle
        run: node scripts/prepare-release-bundle.mjs

      - name: Archive macOS bundle
        if: runner.os != 'Windows'
        shell: bash
        run: |
          VERSION="$(cat VERSION)"
          tar -czf "dist-release/agent-demo-${VERSION}-${{ matrix.name }}.tar.gz" -C dist-release bundle

      - name: Archive Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content VERSION).Trim()
          Compress-Archive -Path dist-release/bundle/* -DestinationPath "dist-release/agent-demo-$version-${{ matrix.name }}.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-demo-${{ matrix.name }}
          path: |
            dist-release/installers/*.dmg
            dist-release/installers/*.exe
            dist-release/*.tar.gz
            dist-release/*.zip

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if [ "$RELEASE_TAG" = "main" ]; then
            RELEASE_TAG="v$(cat VERSION)"
          fi
          gh release create "$RELEASE_TAG" release-artifacts/* \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --notes "Automated release for $RELEASE_TAG" \
          || gh release upload "$RELEASE_TAG" release-artifacts/* --clobber
